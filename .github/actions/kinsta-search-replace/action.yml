---
name: kinsta-search-replace
description: Search-replace values in an environment's database
inputs:
  SITE_ID:
    required: true
  ENVIRONMENT_ID:
    required: true
  PAIRS:
    description: >-
      Newline-separated search and replace values, tab-separated, applied
      in the order given
    required: true
  KINSTA_API_URL:
    required: true
  KINSTA_API_KEY:
    required: true
  MAX_ATTEMPTS:
    required: false
    default: '40'
  SLEEP_SECONDS:
    required: false
    default: '15'
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/run.sh"
      env:
        INPUT_SITE_ID: ${{ inputs.SITE_ID }}
        INPUT_ENVIRONMENT_ID: ${{ inputs.ENVIRONMENT_ID }}
        INPUT_PAIRS: ${{ inputs.PAIRS }}
        INPUT_KINSTA_API_URL: ${{ inputs.KINSTA_API_URL }}
        INPUT_KINSTA_API_KEY: ${{ inputs.KINSTA_API_KEY }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.MAX_ATTEMPTS }}
        INPUT_SLEEP_SECONDS: ${{ inputs.SLEEP_SECONDS }}
