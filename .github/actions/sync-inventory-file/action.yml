---
name: sync-inventory-file
description: >-
  Commit a locally computed file to a new branch, open a PR, wait for its
  required checks, then merge
inputs:
  REPOSITORY:
    required: true
  FILE_PATH:
    required: true
  CONTENT_FILE:
    required: true
  COMMIT_MESSAGE:
    required: true
  CHECK_NAMES:
    required: true
  GITHUB_TOKEN:
    required: true
outputs:
  PR_NUMBER:
    value: ${{ steps.run.outputs.PR_NUMBER }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: bash "${{ github.action_path }}/run.sh"
      env:
        INPUT_REPOSITORY: ${{ inputs.REPOSITORY }}
        INPUT_FILE_PATH: ${{ inputs.FILE_PATH }}
        INPUT_CONTENT_FILE: ${{ inputs.CONTENT_FILE }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.COMMIT_MESSAGE }}
        INPUT_CHECK_NAMES: ${{ inputs.CHECK_NAMES }}
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
