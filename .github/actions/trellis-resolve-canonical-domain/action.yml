---
name: trellis-resolve-canonical-domain
description: Resolve an environment's canonical domain from a Trellis checkout
inputs:
  WORDPRESS_SITES_FILE:
    description: Path to group_vars/<environment>/wordpress_sites.yml
    required: true
  BASE_DOMAIN:
    description: Zone the resolved domain must belong to
    required: true
outputs:
  PRIMARY_DOMAIN:
    value: ${{ steps.run.outputs.PRIMARY_DOMAIN }}
runs:
  using: composite
  steps:
    - name: Set up Python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install PyYAML
      shell: bash
      # yamllint disable-line rule:line-length
      run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3
    - id: run
      shell: bash
      run: bash "${{ github.action_path }}/run.sh"
      env:
        INPUT_WORDPRESS_SITES_FILE: ${{ inputs.WORDPRESS_SITES_FILE }}
        INPUT_BASE_DOMAIN: ${{ inputs.BASE_DOMAIN }}
