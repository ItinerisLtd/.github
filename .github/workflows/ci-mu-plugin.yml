# yamllint disable-line rule:document-start
name: ci-mu-plugin

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      PHP_VERSION:
        type: number
        default: 7.4
        required: false
      PHP_VERSION_FILE:
        type: string
        description: Path to a file holding only the PHP version (e.g. .php-version), takes precedence over PHP_VERSION
        default: ''
        required: false
    secrets:
      PRIVATE_PACKAGIST_TOKEN:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        description: Unused, CI no longer connects to Tailscale. Kept so existing callers that pass it stay valid
        required: false
      TAILSCALE_OAUTH_SECRET:
        description: Unused, CI no longer connects to Tailscale. Kept so existing callers that pass it stay valid
        required: false
      TAILSCALE_EXIT_NODE:
        description: Unused, CI no longer connects to Tailscale. Kept so existing callers that pass it stay valid
        required: false

jobs:
  php:
    name: php-style-check
    runs-on: ubuntu-latest
    env:
      PRIVATE_PACKAGIST_TOKEN: ${{ secrets.PRIVATE_PACKAGIST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ inputs.PHP_VERSION_FILE || inputs.PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.PHP_VERSION_FILE == '' && inputs.PHP_VERSION || '' }}
          php-version-file: ${{ inputs.PHP_VERSION_FILE }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "${GITHUB_OUTPUT}"
          echo "php=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" >> "${GITHUB_OUTPUT}"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ steps.composer-cache.outputs.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.composer-cache.outputs.php }}-composer-

      - if: ${{ env.PRIVATE_PACKAGIST_TOKEN != '' }}
        name: Setup Composer Private Packagist authentication
        run: composer config --global --auth http-basic.repo.packagist.com itineris "${PRIVATE_PACKAGIST_TOKEN}"

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - run: composer run-script style:check
