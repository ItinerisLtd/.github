# yamllint disable-line rule:document-start
name: ci-radicle

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      NODE_VERSION:
        type: number
        default: 20
        required: false
      NODE_VERSION_FILE:
        type: string
        description: Path to a Node version file relative to the repository root (e.g. .nvmrc), takes precedence over NODE_VERSION
        default: ''
        required: false
      PHP_VERSION:
        type: number
        default: 8.1
        required: false
      PHP_VERSION_FILE:
        type: string
        description: Path to a file holding only the PHP version, relative to the repository root (e.g. .php-version), takes precedence over PHP_VERSION
        default: ''
        required: false
      NPM_BUILD_CMD:
        type: string
        default: yarn build:production
        required: false
    secrets:
      FONTAWESOME_NPM_AUTH_TOKEN:
        required: false
      PRIVATE_PACKAGIST_TOKEN:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_SECRET:
        required: false
      TAILSCALE_EXIT_NODE:
        required: false

jobs:
  check-theme-changes:
    runs-on: ubuntu-latest
    outputs:
      RADICLE_CHANGED: ${{ steps.diff.outputs.RADICLE_CHANGED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: diff
        run: |
          git fetch --no-tags --prune --depth=1 origin ${{ github.event.repository.default_branch }}
          CHANGED_FILES=$(git diff origin/${{ github.event.repository.default_branch }} HEAD --name-only --diff-filter=ACMRT)
          FILES_CHANGED=$([[ -z "${CHANGED_FILES}" ]] && echo 'false' || echo 'true')
          echo "RADICLE_CHANGED=${FILES_CHANGED}" >> "${GITHUB_OUTPUT}"

  node:
    name: build-production-assets
    needs: check-theme-changes
    if: ${{ needs.check-theme-changes.outputs.RADICLE_CHANGED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node ${{ inputs.NODE_VERSION_FILE || inputs.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.NODE_VERSION_FILE == '' && inputs.NODE_VERSION || '' }}
          node-version-file: ${{ inputs.NODE_VERSION_FILE }}
          cache: yarn
          cache-dependency-path: yarn.lock
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies with Yarn
        run: yarn install --frozen-lockfile --prefer-offline --verbose
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Font Awesome Blade Icons
        run: grep --quiet 'icons:prepare' package.json && yarn icons:prepare || echo 'No icons to prepare'
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

      - name: Build and compile assets
        run: ${{ inputs.NPM_BUILD_CMD }}
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}

  php:
    name: php-style-check
    needs: check-theme-changes
    if: ${{ needs.check-theme-changes.outputs.RADICLE_CHANGED == 'true' }}
    runs-on: ubuntu-latest
    env:
      PRIVATE_PACKAGIST_TOKEN: ${{ secrets.PRIVATE_PACKAGIST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ inputs.PHP_VERSION_FILE || inputs.PHP_VERSION }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.PHP_VERSION_FILE == '' && inputs.PHP_VERSION || '' }}
          php-version-file: ${{ inputs.PHP_VERSION_FILE }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "${GITHUB_OUTPUT}"
          echo "php=$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" >> "${GITHUB_OUTPUT}"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ steps.composer-cache.outputs.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-${{ steps.composer-cache.outputs.php }}-composer-

      - if: ${{ env.PRIVATE_PACKAGIST_TOKEN != '' }}
        name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          version: ${{ vars.TAILSCALE_VERSION }}
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}"
          ping: ${{ secrets.TAILSCALE_EXIT_NODE }}
          tags: tag:ci

      - if: ${{ env.PRIVATE_PACKAGIST_TOKEN != '' }}
        name: Setup Composer Private Packagist authentication
        run: composer config --global --auth http-basic.repo.packagist.com itineris "${PRIVATE_PACKAGIST_TOKEN}"

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - if: ${{ env.PRIVATE_PACKAGIST_TOKEN != '' }}
        name: Disconnect from Tailscale
        run: sudo tailscale down

      # todo: decide if we want to run the lint and use laravel pint
      - name: Execute the Composer lint script
        run: composer run-script lint

      - name: Execute the Composer style check script
        run: composer run-script style:check
