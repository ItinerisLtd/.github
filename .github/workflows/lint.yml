# yamllint disable-line rule:document-start
name: "Lint"

# yamllint disable-line rule:truthy
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      YAML_CHANGED: ${{ steps.diff.outputs.YAML_CHANGED }}
      WORKFLOWS_CHANGED: ${{ steps.diff.outputs.WORKFLOWS_CHANGED }}
      SHELL_CHANGED: ${{ steps.diff.outputs.SHELL_CHANGED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: diff
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD)
          YAML_CHANGED=$(grep -qE '\.ya?ml$' <<< "${CHANGED_FILES}" && echo 'true' || echo 'false')
          WORKFLOWS_CHANGED=$(grep -qE '^\.github/(workflows/|actionlint-matcher\.json$)' <<< "${CHANGED_FILES}" && echo 'true' || echo 'false')
          SHELL_CHANGED=$(grep -qE '\.sh$' <<< "${CHANGED_FILES}" && echo 'true' || echo 'false')
          {
            echo "YAML_CHANGED=${YAML_CHANGED}"
            echo "WORKFLOWS_CHANGED=${WORKFLOWS_CHANGED}"
            echo "SHELL_CHANGED=${SHELL_CHANGED}"
          } >> "${GITHUB_OUTPUT}"

  yamllint:
    needs: changes
    if: ${{ needs.changes.outputs.YAML_CHANGED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: pipx install yamllint==1.38.0
      - run: yamllint --strict .

  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.WORKFLOWS_CHANGED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: echo "::add-matcher::.github/actionlint-matcher.json"
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  shellcheck:
    needs: changes
    if: ${{ needs.changes.outputs.SHELL_CHANGED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --external-sources --source-path=SCRIPTDIR
