# yamllint disable-line rule:document-start
name: deploy

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      BEDROCK_DEPLOY_BRANCH:
        type: string
        default: "${{ github.ref_name }}"
        required: false
      NODE_VERSION:
        type: number
        default: 14
        required: false
      THEME_NAME:
        type: string
        default: ""
        required: false
      TRELLIS_ENVIRONMENT:
        type: string
        required: true
      SSH_HOST:
        description: Override the inventory ansible_host for this deploy
        type: string
        required: false
        default: ''
      SSH_PORT:
        description: Override the inventory ansible_port for this deploy
        type: string
        required: false
        default: ''
      SSH_USER:
        description: >-
          SSH user to write into the Bedrock wp-cli alias, alongside
          SSH_HOST/SSH_PORT
        type: string
        required: false
        default: ''
      SHARED_ACTIONS_REF:
        description: >-
          Ref of ItinerisLtd/.github holding the composite actions. Required
          only when overriding SSH details; pass the same ref this workflow
          is pinned to.
        type: string
        required: false
        default: ''
      TRELLIS_CI_CHECK_NAMES:
        description: >-
          Newline-separated required check-run names (Checks API, not the
          legacy Statuses API) on the Trellis repo to wait for before
          auto-merging the inventory sync PR
        type: string
        required: false
        default: "test (3.x)"
      BEDROCK_CI_CHECK_NAMES:
        description: >-
          Newline-separated required check-run names (Checks API, not the
          legacy Statuses API) on this repo to wait for before auto-merging
          the wp-cli alias sync PR
        type: string
        required: false
        default: |-
          mu-plugin / php-style-check
          theme / php-style-check
          theme / build-production-assets
          theme / check-theme-changes
      BEDROCK_ALIAS_FILE:
        description: >-
          Path, relative to the Bedrock repo root, of the wp-cli Trellis
          alias file to sync SSH details into. Cognomen-based projects use
          wp-cli-cognomen.yml instead of the default.
        type: string
        required: false
        default: wp-cli.trellis-alias.yml
      TRELLIS_REPOSITORY:
        type: string
        required: true
      TRELLIS_CLI_AUTO_INIT:
        type: boolean
        default: true
        required: false
      TRELLIS_CLI_CACHE_VIRTUALENV:
        type: boolean
        default: true
        required: false
      TRELLIS_CLI_GALAXY_INSTALL:
        type: boolean
        default: true
        required: false
      TRELLIS_CLI_VERSION:
        type: string
        default: latest
        required: false
    secrets:
      REPO_PAT:
        required: true
      TRELLIS_INVENTORY_BOT_APP_ID:
        required: false
      TRELLIS_INVENTORY_BOT_PRIVATE_KEY:
        required: false
      TRELLIS_DEPLOY_SSH_PRIVATE_KEY:
        required: true
      TRELLIS_DEPLOY_SSH_KNOWN_HOSTS:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true
      FONTAWESOME_NPM_AUTH_TOKEN:
        required: false
      ITINERIS_NPM_AUTH_TOKEN:
        required: false
      ITINERIS_REPO_READ_TOKEN:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: true
      TAILSCALE_OAUTH_SECRET:
        required: true
      TAILSCALE_EXIT_NODE:
        required: true
      OPCACHE_PURGE_TOKEN:
        required: false
      OPCACHE_PURGE_USER_AGENT:
        required: false

jobs:
  deploy:
    name: "${{ inputs.TRELLIS_ENVIRONMENT }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.TRELLIS_ENVIRONMENT }}

    concurrency:
      # yamllint disable-line rule:line-length
      group: "${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.TRELLIS_ENVIRONMENT }}"
      cancel-in-progress: false
    if: >-
      github.sha != vars.LAST_DEPLOY
      && github.actor != 'kodiakhq[bot]'
      && github.actor != 'dependabot[bot]'
      && !contains(github.event.head_commit.message, '[cd skip]')
    steps:
      - name: Checkout Trellis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: "${{ inputs.TRELLIS_REPOSITORY }}"
          path: trellis
          token: "${{ secrets.REPO_PAT }}"

      - name: Check shared actions ref
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        env:
          SHARED_ACTIONS_REF: ${{ inputs.SHARED_ACTIONS_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$SHARED_ACTIONS_REF" ]]; then
            echo "SHARED_ACTIONS_REF is required to override SSH details." >&2
            echo "Pass the same ref this workflow is pinned to." >&2
            exit 1
          fi

      - name: Check inventory bot credentials
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        env:
          APP_ID: ${{ secrets.TRELLIS_INVENTORY_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.TRELLIS_INVENTORY_BOT_PRIVATE_KEY }}
          SSH_USER: ${{ inputs.SSH_USER }}
          SSH_HOST: ${{ inputs.SSH_HOST }}
          SSH_PORT: ${{ inputs.SSH_PORT }}
        # yamllint disable rule:line-length
        run: |
          set -euo pipefail
          if [[ -z "$SSH_HOST" || -z "$SSH_PORT" ]]; then
            echo "SSH_HOST and SSH_PORT must be given together." >&2
            exit 1
          fi
          if [[ -z "$APP_ID" || -z "$PRIVATE_KEY" || -z "$SSH_USER" ]]; then
            echo "TRELLIS_INVENTORY_BOT_APP_ID, TRELLIS_INVENTORY_BOT_PRIVATE_KEY, and SSH_USER are required to sync SSH details." >&2
            exit 1
          fi
        # yamllint enable rule:line-length

      - name: Compute repository short names
        id: repo-names
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        env:
          TRELLIS_REPOSITORY: ${{ inputs.TRELLIS_REPOSITORY }}
          BEDROCK_REPOSITORY: ${{ github.repository }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        # yamllint disable rule:line-length
        run: |
          set -euo pipefail
          if [[ "$TRELLIS_REPOSITORY" != */* ]]; then
            echo "TRELLIS_REPOSITORY '$TRELLIS_REPOSITORY' is not in 'owner/repo' format." >&2
            exit 1
          fi
          TRELLIS_OWNER="${TRELLIS_REPOSITORY%%/*}"
          if [[ "$TRELLIS_OWNER" != "$EXPECTED_OWNER" ]]; then
            echo "TRELLIS_REPOSITORY's owner '$TRELLIS_OWNER' does not match this workflow's owner '$EXPECTED_OWNER'. The inventory bot App token is minted for a single owner, so a cross-owner Trellis repo is not supported." >&2
            exit 1
          fi
          {
            printf 'TRELLIS_REPO_SHORT=%s\n' "${TRELLIS_REPOSITORY#*/}"
            printf 'BEDROCK_REPO_SHORT=%s\n' "${BEDROCK_REPOSITORY#*/}"
          } >>"$GITHUB_OUTPUT"
        # yamllint enable rule:line-length

      - name: Generate inventory bot token
        id: inventory-bot-token
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.TRELLIS_INVENTORY_BOT_APP_ID }}
          private-key: ${{ secrets.TRELLIS_INVENTORY_BOT_PRIVATE_KEY }}
          repositories: |
            ${{ steps.repo-names.outputs.TRELLIS_REPO_SHORT }}
            ${{ steps.repo-names.outputs.BEDROCK_REPO_SHORT }}

      - name: Snapshot original Trellis inventory
        id: trellis-snapshot
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        # yamllint disable-line rule:line-length
        run: cp "trellis/hosts/${{ inputs.TRELLIS_ENVIRONMENT }}" "$RUNNER_TEMP/hosts.orig"

      - name: Checkout shared actions
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ItinerisLtd/.github
          ref: ${{ inputs.SHARED_ACTIONS_REF }}
          path: .itineris-actions
          persist-credentials: false

      - name: Override inventory SSH details
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        uses: ./.itineris-actions/.github/actions/trellis-override-inventory
        with:
          SSH_HOST: ${{ inputs.SSH_HOST }}
          SSH_PORT: ${{ inputs.SSH_PORT }}
          TRELLIS_ENVIRONMENT: ${{ inputs.TRELLIS_ENVIRONMENT }}
          HOSTS_FILE: trellis/hosts/${{ inputs.TRELLIS_ENVIRONMENT }}

      - name: Check if Trellis inventory changed
        id: trellis-diff
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        # yamllint disable rule:line-length
        run: |
          set -euo pipefail
          if diff -q "$RUNNER_TEMP/hosts.orig" "trellis/hosts/${{ inputs.TRELLIS_ENVIRONMENT }}" >/dev/null; then
            echo "CHANGED=false" >>"$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >>"$GITHUB_OUTPUT"
          fi
        # yamllint enable rule:line-length

      - name: Sync Trellis inventory
        if: >-
          (inputs.SSH_HOST != '' || inputs.SSH_PORT != '')
          && steps.trellis-diff.outputs.CHANGED == 'true'
        uses: ./.itineris-actions/.github/actions/sync-inventory-file
        with:
          REPOSITORY: ${{ inputs.TRELLIS_REPOSITORY }}
          FILE_PATH: hosts/${{ inputs.TRELLIS_ENVIRONMENT }}
          CONTENT_FILE: trellis/hosts/${{ inputs.TRELLIS_ENVIRONMENT }}
          # yamllint disable-line rule:line-length
          COMMIT_MESSAGE: "fix(inventory): refresh Kinsta SSH details for ${{ inputs.TRELLIS_ENVIRONMENT }}"
          CHECK_NAMES: ${{ inputs.TRELLIS_CI_CHECK_NAMES }}
          GITHUB_TOKEN: ${{ steps.inventory-bot-token.outputs.token }}

      - name: Get environment IP address
        # yamllint disable rule:line-length
        run: |
          HOST_IP="$(grep -Po 'ansible_host=((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.?\b){4}' "hosts/${{ inputs.TRELLIS_ENVIRONMENT }}" | sed 's/ansible_host=//g')"
          if [ -z "${HOST_IP}" ]; then
            echo 'HOST_IP not found.'
            exit 1
          fi
          echo "HOST_IP=${HOST_IP}" >> "${GITHUB_ENV}"
        # yamllint enable rule:line-length
        working-directory: trellis

      - name: Checkout Bedrock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: bedrock
          persist-credentials: false

      - name: Snapshot original Bedrock alias
        id: bedrock-snapshot
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        # yamllint disable-line rule:line-length
        run: cp "bedrock/${{ inputs.BEDROCK_ALIAS_FILE }}" "$RUNNER_TEMP/alias.orig"

      - name: Override Bedrock alias SSH details
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        uses: ./.itineris-actions/.github/actions/bedrock-override-alias
        with:
          SSH_USER: ${{ inputs.SSH_USER }}
          SSH_HOST: ${{ inputs.SSH_HOST }}
          SSH_PORT: ${{ inputs.SSH_PORT }}
          TRELLIS_ENVIRONMENT: ${{ inputs.TRELLIS_ENVIRONMENT }}
          ALIAS_FILE: bedrock/${{ inputs.BEDROCK_ALIAS_FILE }}

      - name: Check if Bedrock alias changed
        id: bedrock-diff
        if: ${{ inputs.SSH_HOST != '' || inputs.SSH_PORT != '' }}
        # yamllint disable rule:line-length
        run: |
          set -euo pipefail
          if diff -q "$RUNNER_TEMP/alias.orig" "bedrock/${{ inputs.BEDROCK_ALIAS_FILE }}" >/dev/null; then
            echo "CHANGED=false" >>"$GITHUB_OUTPUT"
          else
            echo "CHANGED=true" >>"$GITHUB_OUTPUT"
          fi
        # yamllint enable rule:line-length

      - name: Sync Bedrock alias
        if: >-
          (inputs.SSH_HOST != '' || inputs.SSH_PORT != '')
          && steps.bedrock-diff.outputs.CHANGED == 'true'
        uses: ./.itineris-actions/.github/actions/sync-inventory-file
        with:
          REPOSITORY: ${{ github.repository }}
          FILE_PATH: ${{ inputs.BEDROCK_ALIAS_FILE }}
          CONTENT_FILE: bedrock/${{ inputs.BEDROCK_ALIAS_FILE }}
          # yamllint disable-line rule:line-length
          COMMIT_MESSAGE: "fix(inventory): refresh Kinsta SSH alias for ${{ inputs.TRELLIS_ENVIRONMENT }}"
          CHECK_NAMES: ${{ inputs.BEDROCK_CI_CHECK_NAMES }}
          GITHUB_TOKEN: ${{ steps.inventory-bot-token.outputs.token }}

      - name: Configure git auth for org packages
        # yamllint disable rule:line-length
        run: |
          if [ -n "${ITINERIS_REPO_READ_TOKEN}" ]; then
            git config --global url."https://x-access-token:${ITINERIS_REPO_READ_TOKEN}@github.com/ItinerisLtd/".insteadOf "https://github.com/ItinerisLtd/"
          fi
        # yamllint enable rule:line-length
        env:
          ITINERIS_REPO_READ_TOKEN: ${{ secrets.ITINERIS_REPO_READ_TOKEN }}

      - name: Setup Node ${{ inputs.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: "${{ inputs.THEME_NAME != '' }}"
        with:
          node-version: "${{ inputs.NODE_VERSION }}"
          cache: yarn
          # yamllint disable-line rule:line-length
          cache-dependency-path: bedrock/web/app/themes/${{ inputs.THEME_NAME }}/yarn.lock
        env:
          # yamllint disable-line rule:line-length
          FONTAWESOME_NPM_AUTH_TOKEN: "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITINERIS_NPM_AUTH_TOKEN: ${{ secrets.ITINERIS_NPM_AUTH_TOKEN }}

      - uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3
        with:
          key: "${{ secrets.TRELLIS_DEPLOY_SSH_PRIVATE_KEY }}"
          known_hosts: "${{ secrets.TRELLIS_DEPLOY_SSH_KNOWN_HOSTS }}"

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: "${{ secrets.TRELLIS_DEPLOY_SSH_PRIVATE_KEY }}"

      - uses: roots/setup-trellis-cli@aca8a0213f85ccee09f8f42597391934a03430e9
        with:
          ansible-vault-password: "${{ secrets.ANSIBLE_VAULT_PASSWORD }}"
          auto-init: "${{ inputs.TRELLIS_CLI_AUTO_INIT }}"
          cache-virtualenv: "${{ inputs.TRELLIS_CLI_CACHE_VIRTUALENV }}"
          galaxy-install: "${{ inputs.TRELLIS_CLI_GALAXY_INSTALL }}"
          version: "${{ inputs.TRELLIS_CLI_VERSION }}"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          version: "1.102.3"
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}"
          ping: ${{ secrets.TAILSCALE_EXIT_NODE }}
          tags: tag:ci

      - name: Deploy
        working-directory: trellis
        # yamllint disable-line rule:line-length
        run: trellis deploy --verbose --branch="${{ inputs.BEDROCK_DEPLOY_BRANCH }}" "${{ inputs.TRELLIS_ENVIRONMENT }}"
        env:
          # yamllint disable-line rule:line-length
          FONTAWESOME_NPM_AUTH_TOKEN: "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"
          ITINERIS_NPM_AUTH_TOKEN: ${{ secrets.ITINERIS_NPM_AUTH_TOKEN }}

      - name: Reset OPcache
        working-directory: trellis
        env:
          OPCACHE_PURGE_TOKEN: ${{ secrets.OPCACHE_PURGE_TOKEN }}
          OPCACHE_PURGE_USER_AGENT: ${{ secrets.OPCACHE_PURGE_USER_AGENT }}
          TRELLIS_ENVIRONMENT: ${{ inputs.TRELLIS_ENVIRONMENT }}
        # yamllint disable rule:line-length
        run: |
          if [ -z "${OPCACHE_PURGE_TOKEN}" ]; then
            echo 'OPCACHE_PURGE_TOKEN not configured - skipping OPcache reset.'
            exit 0
          fi
          HOSTS="$(python3 -c '
          import os, yaml
          env = os.environ["TRELLIS_ENVIRONMENT"]
          with open(f"group_vars/{env}/wordpress_sites.yml") as f:
              sites = yaml.safe_load(f).get("wordpress_sites") or {}
          for site in sites.values():
              hosts = site.get("site_hosts") or []
              if hosts and hosts[0].get("canonical"):
                  print(hosts[0]["canonical"])
          ')"
          for HOST in ${HOSTS}; do
            BODY="$(curl --silent --max-time 30 \
              --user-agent "${OPCACHE_PURGE_USER_AGENT:-ItinerisServer/1.0}" \
              --header "X-Opcache-Purge: ${OPCACHE_PURGE_TOKEN}" \
              "https://${HOST}/?opcache_purge=deploy-${GITHUB_SHA}" || true)"
            if printf '%s' "${BODY}" | grep -q '"reset":true'; then
              echo "OPcache reset: OK (${HOST})"
            else
              echo "::warning::OPcache purge not confirmed for ${HOST} (mu-plugin missing, token mismatch, or edge block). Deploy unaffected."
            fi
          done
        # yamllint enable rule:line-length

      - name: Disconnect from Tailscale
        run: sudo tailscale down

      - name: Cache deployed commit hash
        run: >-
          gh variable set LAST_DEPLOY
          --env '${{ inputs.TRELLIS_ENVIRONMENT }}'
          --body='${{ github.sha }}'
        working-directory: bedrock
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
